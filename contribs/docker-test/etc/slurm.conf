# slurm.conf - SLURM test cluster (QoS preemption + node-failure testing)
# Shared by slurmctld and all slurmd nodes.

ClusterName=cluster
SlurmctldHost=slurmctld

# --- Auth / comms ---------------------------------------------------------
AuthType=auth/munge
CredType=cred/munge
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818

# --- Scheduling / resource selection -------------------------------------
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# requeue_delay=0: don't hold requeued jobs for the default ~2min so the e2e
# requeue-limit loops re-run jobs promptly.
SchedulerParameters=requeue_delay=0

# --- Preemption (QoS based) -----------------------------------------------
# A higher-priority QoS (high) preempts a lower one (low). Requeue the victim.
PreemptType=preempt/qos
PreemptMode=REQUEUE

# --- Cause-aware requeue limits (small values for fast e2e testing) -------
# NODE_FAIL and PREEMPT requeues each get their own counter+limit; launch/prolog
# failures keep using MaxBatchRequeue.
MaxBatchRequeue=5
MaxNodeFailRequeue=2
MaxPreemptRequeue=2

# --- Process tracking / accounting gather ---------------------------------
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

# --- Accounting (slurmdbd) ------------------------------------------------
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
# Enforce associations + QoS so preemption/limits actually apply.
AccountingStorageEnforce=associations,limits,qos

# --- Node health / failure handling ---------------------------------------
# ReturnToService=1: a DOWN node that registers again with a valid config
# returns to service automatically (handy after simulated failures).
ReturnToService=1
SlurmctldParameters=enable_configless
# Detect a dead slurmd reasonably fast for failure tests.
SlurmdTimeout=30
SlurmctldTimeout=60

# --- Timers ---------------------------------------------------------------
InactiveLimit=0
MinJobAge=300
KillWait=10
Waittime=0

# --- Logging / state ------------------------------------------------------
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# --- Nodes ----------------------------------------------------------------
# Resources kept small; plenty for placement/preemption tests.
NodeName=c1 NodeAddr=c1 CPUs=2 RealMemory=1024 State=UNKNOWN
NodeName=c2 NodeAddr=c2 CPUs=2 RealMemory=1024 State=UNKNOWN

# --- Partitions -----------------------------------------------------------
PartitionName=normal Nodes=c1,c2 Default=YES MaxTime=INFINITE State=UP
