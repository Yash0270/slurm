# slurmdbd.conf - SLURM accounting database daemon.
# Must be mode 0600 owned by SlurmUser (handled in entrypoint).

AuthType=auth/munge
DbdHost=slurmdbd
DbdPort=6819

SlurmUser=slurm

# Storage backend (MariaDB service "mysql" from docker-compose).
StorageType=accounting_storage/mysql
StorageHost=mysql
StoragePort=3306
StorageUser=slurm
StoragePass=slurmpass
StorageLoc=slurm_acct_db

LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurm/slurmdbd.pid
DebugLevel=info
